# Fly.io-config för Timglas backend.
# Viktigt: appen är en enda auktoritativ process med tillstånd i minnet + SQLite,
# så den måste köra som EXAKT en maskin som aldrig stoppas.
app = "timglas"
primary_region = "arn" # Stockholm

[build]

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

[mounts]
  source = "timglas_data"
  destination = "/data"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
